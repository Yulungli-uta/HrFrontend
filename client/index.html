<!DOCTYPE html>
<html lang="es" data-brand="uta2026">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WsUtaSystem - Gestión de Talento Humano UTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      /* Aplica tema y preferencias visuales guardadas antes del primer pintado (evita el parpadeo). */
      (function () {
        try {
          var r = document.documentElement;
          var v = JSON.parse(localStorage.getItem("wsuta-prefs-visual") || "{}");
          r.dataset.fontScale = v.fontScale || "normal";
          r.dataset.density = v.density || "standard";
          r.dataset.contrast = v.highContrast ? "high" : "normal";
          r.dataset.motion = v.reduceMotion ? "reduce" : "normal";
          var t = localStorage.getItem("vite-ui-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          r.classList.remove("light", "dark");
          r.classList.add(dark ? "dark" : "light");
        } catch (e) { /* sin almacenamiento: valores por defecto */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <!-- <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script> -->
  </body>
</html>
